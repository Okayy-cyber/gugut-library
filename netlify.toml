# Netlify configuration for Gugut Library
# https://gugut-childrens-library.netlify.app

[build]
  publish = "."
  functions = "netlify/functions"

# Book page images never change once published — cache aggressively at the
# CDN and in the browser (repeat opens become instant, CDN stays warm)
[[headers]]
  for = "/pages/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Serve index.html for all routes (single-page app)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
